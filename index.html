<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arplex Arcade - Sega Rally 1995</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        #game-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            border: 4px solid #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            background-color: #000;
        }
        #emulator-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>ARPLEX HORIZON ARCADE</h1>

    <div id="game-container">
        <iframe id="emulator-iframe" allowfullscreen="true" scrolling="no"></iframe>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const iframe = document.getElementById('emulator-iframe');
            
            // EmulatorJS'in resmî, ayakta duran ve stabil çalışan genel oynatıcı sunucusu
            const basePlayer = "https://emulatorjs.org/emu/";
            const system = "arcade";
            const backend = "mame";
            const romUrl = "https://archive.org/download/srallyc/srallyc.zip";
            
            // Tarayıcının URL yapısını bozmasını engellemek için parametreleri güvenli bir şekilde birleştiriyoruz
            const targetUrl = basePlayer + 
                              "?system=" + system + 
                              "&backend=" + backend + 
                              "&rom=" + encodeURIComponent(romUrl);
            
            // iframe'i doğrudan bu temiz, harici bağımsız adrese yönlendiriyoruz
            iframe.src = targetUrl;
        });
    </script>

</body>
</html>
