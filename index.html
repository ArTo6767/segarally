<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arplex Arcade - Sega Rally 1995</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        #game-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            border: 4px solid #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            background-color: #000;
            position: relative;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js"></script>
</head>
<body>

    <h1>ARPLEX HORIZON ARCADE</h1>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        window.addEventListener('load', function() {
            // EmulatorJS'in sinsi yol kırpma fonksiyonunu alt etmek için base path'i zorluyoruz
            EmuJS.init({
                id: 'game',
                system: 'arcade',
                backend: 'mame',
                // ROM dosyasını doğrudan Archive.org üzerinden çekmesini dikte ediyoruz
                rom: 'https://archive.org/download/srallyc/srallyc.zip',
                // Dosyaların kendi sitene sapmasını önleyen mutlak CDN dizini parametresi
                dataUrl: 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/',
                autoStart: true,
                startOnLoad: true
            });
        });
    </script>

</body>
</html>
