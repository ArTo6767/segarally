<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arplex Arcade - Sega Rally 1995</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            letter-spacing: 2px;
        }
        #game-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <h1>ARPLEX HORIZON ARCADE</h1>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script src="./config.js"></script>
    <script src="./config.js"></script>
    
    <script>
        EmuJS.init({
            id: 'game',
            system: 'arcade', 
            // Direkt dosya adını veriyoruz, config.js bunu tam linke çevirecek
            rom: 'segarally.zip', 
            backend: 'mame', 
            autoStart: true, 
            Format: 'capsule'
        });
    </script>

</body>
</html>
