<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arplex Arcade - Sega Rally 1995</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #game-container {
            width: 800px;
            height: 600px;
            max-width: 100%;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background-color: #000;
        }
        #arcade-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>ARPLEX HORIZON ARCADE</h1>

    <div id="game-container">
        <iframe id="arcade-frame" allowfullscreen="true" scrolling="no"></iframe>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const iframe = document.getElementById('arcade-frame');
            
            // EmulatorJS'in harici oynatıcısı için tam, kırpılmayan temiz URL şablonu
            const baseUrl = "https://emulatorjs.org/emu/";
            const system = "arcade";
            const backend = "mame";
            const romUrl = "https://archive.org/download/srallyc/srallyc.zip";
            
            // Tarayıcının ve sunucunun linki bükmesini engellemek için bileşenleri güvenli encode ediyoruz
            const finalSrc = `${baseUrl}?system=${system}&backend=${backend}&rom=${encodeURIComponent(romUrl)}`;
            
            // Linki doğrudan iframe'e postalıyoruz
            iframe.src = finalSrc;
        });
    </script>

</body>
</html>
